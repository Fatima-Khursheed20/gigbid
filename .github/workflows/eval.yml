name: Eval gate
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional; without it the offline gates run
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with: {path: .cache/fastembed, key: fastembed-v1}
      - run: uv sync --frozen --extra dev
      - name: 30-job smoke eval with thresholds (evals/thresholds.yaml)
        run: uv run python -m evals.runners.smoke_eval
      - name: Retrieval regression (V0 vs shipped variant, 10 jobs/persona)
        run: LLM_OFFLINE=1 uv run python -m evals.runners.rag_eval --variants v0_naive,v4_outcome --limit 10 --out smoke_rag
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-results, path: evals/results}
