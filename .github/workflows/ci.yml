name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      LLM_OFFLINE: "1"
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with: {path: .cache/fastembed, key: fastembed-v1}
      - run: uv sync --frozen --extra dev
      - name: Repository rules (secrets, gigsim unchanged, prompts in agent/prompts, README numbers)
        run: uv run python -m scripts.ci_checks
      - name: Lint
        run: uv run ruff check .
      - name: Unit + MCP + contract (schema snapshot) + integration tests
        run: uv run pytest -q -W ignore::UserWarning

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      LLM_OFFLINE: "1"
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef
      REVIEWER_EMAIL: reviewer@gigbid.test
      REVIEWER_PASSWORD: ci-reviewer-pass-123
      GIGSIM_ERROR_RATE: "0"
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - uses: actions/cache@v4
        with: {path: .cache/fastembed, key: fastembed-v1}
      - run: uv sync --frozen --extra dev
      - working-directory: apps/web
        run: npm ci && npx tsc -b && npm run build && npx playwright install --with-deps chromium
      - name: Start GigBid stack
        run: |
          nohup uv run python -m scripts.run_stack > stack.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8000/api/health && break; sleep 2; done
      - name: Playwright
        working-directory: apps/web
        env: {E2E_BASE_URL: "http://localhost:8000"}
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: "apps/web/playwright-report\nstack.log"}
