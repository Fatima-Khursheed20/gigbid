# docker compose -f infra/docker-compose.yml --env-file .env up --build
# Starts web, API, worker, the three MCP servers, GigSim, Postgres (+pgvector = the vector store), Redis and
# Ollama (local open-model profile; pull a model with: docker compose exec ollama ollama pull qwen3:4b).
name: gigbid
x-app: &app
  env_file: ../.env
  environment: &appenv
    DATABASE_URL: postgresql://gigbid:gigbid@postgres:5432/gigbid
    REDIS_URL: redis://redis:6379/0
    GIGSIM_BASE_URL: http://gigsim:8081
    MCP_PORTFOLIO_URL: http://mcp-portfolio:8101/mcp
    MCP_MARKETPLACE_URL: http://mcp-marketplace:8102/mcp
    MCP_WORKSPACE_URL: http://mcp-workspace:8103/mcp
    OLLAMA_BASE_URL: http://ollama:11434/v1
    MCP_ALLOWED_HOSTS: "*"
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U gigbid"], interval: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}
  ollama:
    image: ollama/ollama:0.6.8
    volumes: [ollama:/root/.ollama]
    profiles: [local]
  gigsim:
    <<: *app
    build: {context: .., dockerfile: infra/docker/gigsim.Dockerfile}
    environment: {<<: *appenv, GIGSIM_DB: /data/gigsim.db}
    volumes: [gigsimdata:/data]
  mcp-portfolio:
    <<: *app
    build: {context: .., dockerfile: infra/docker/mcp-portfolio.Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
  mcp-marketplace:
    <<: *app
    build: {context: .., dockerfile: infra/docker/mcp-marketplace.Dockerfile}
    depends_on: [gigsim]
  mcp-workspace:
    <<: *app
    build: {context: .., dockerfile: infra/docker/mcp-workspace.Dockerfile}
    environment: {<<: *appenv, WORKSPACE_DB: /data/workspace.db}
    volumes: [wsdata:/data]
  api:
    <<: *app
    build: {context: .., dockerfile: infra/docker/api.Dockerfile}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  worker:
    <<: *app
    build: {context: .., dockerfile: infra/docker/worker.Dockerfile}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, mcp-marketplace: {condition: service_started}}
  web:
    build: {context: .., dockerfile: infra/docker/web.Dockerfile}
    depends_on: [api]
    ports: ["8080:80"]

volumes: {pgdata: {}, ollama: {}, gigsimdata: {}, wsdata: {}}
